server.port=6969
spring.application.name=dashboard-service

spring.kafka.bootstrap-servers=kafka:29092

spring.kafka.consumer.group-id=log-consumer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.suite.dashboard.model.LogEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

graph.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
graph.neo4j.username=${NEO4J_USER:neo4j}
graph.neo4j.password=${NEO4J_PASSWORD:neo4jdemo123}
health.use-service-names=${HEALTH_USE_NAMES:true}