<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Service Dashboard</title>
    <style>
        :root { --bg:#0d0d10; --card:#17171c; --border:#26262e; --text:#e8e8ec; --muted:#8a8a96; --up:#34d399; --down:#f87171; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; padding:24px 16px 40px; }
        h1 { font-size:1.3rem; margin:0 0 4px; }
        p.sub { color:var(--muted); margin:0 0 20px; font-size:.85rem; }
        .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); max-width:900px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; transition:border-color .3s; }
        .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .name { font-weight:600; }
        .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
        .up .dot { background:var(--up); box-shadow:0 0 6px var(--up); }
        .down .dot { background:var(--down); box-shadow:0 0 6px var(--down); }
        .status { font-size:.8rem; }
        .up .status { color:var(--up); }
        .down .status { color:var(--down); }
        .meta { font-size:.78rem; color:var(--muted); }
        button { margin-top:20px; background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
<h1>Distributed Log Analytics — Live Status</h1>
<p class="sub" id="lastCheck">Checking...</p>
<div class="grid" id="grid"></div>
<button onclick="checkAll()">Refresh now</button>

<script>
    const services = [
        { name: "auth-service", port: 8081 },
        { name: "user-service", port: 8082 },
        { name: "movies-service", port: 8083 },
        { name: "webseries-service", port: 8084 },
        { name: "payment-service", port: 8085 },
    ];

    const grid = document.getElementById("grid");
    services.forEach(s => {
        const card = document.createElement("div");
        card.className = "card down";
        card.id = "card-" + s.port;
        card.innerHTML = `
    <div class="row">
      <span class="name">${s.name}</span>
      <span class="status"><span class="dot"></span><span class="statusText">CHECKING</span></span>
    </div>
    <div class="meta">localhost:${s.port}</div>
  `;
        grid.appendChild(card);
    });

    async function checkOne(s) {
        const card = document.getElementById("card-" + s.port);
        try {
            const res = await fetch(`http://localhost:${s.port}/actuator/health`, { cache: "no-store" });
            const data = await res.json();
            const up = data.status === "UP";
            card.className = "card " + (up ? "up" : "down");
            card.querySelector(".statusText").textContent = up ? "UP" : "DOWN";
        } catch (e) {
            card.className = "card down";
            card.querySelector(".statusText").textContent = "DOWN";
        }
    }

    async function checkAll() {
        document.getElementById("lastCheck").textContent = "Checking...";
        await Promise.all(services.map(checkOne));
        document.getElementById("lastCheck").textContent = "Last checked: " + new Date().toLocaleTimeString();
    }

    checkAll();
    setInterval(checkAll, 5000);
</script>
</body>
</html>
