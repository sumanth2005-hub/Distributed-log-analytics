x-app: &app
  restart: on-failure
  environment:
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  depends_on:
    kafka:
      condition: service_healthy

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  auth-service:
    <<: *app
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_FAIL_PERCENT: "0"

  user-service:
    <<: *app
    build: ./services/user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_FAIL_PERCENT: "30"

  movies-service:
    <<: *app
    build: ./services/movies-service
    container_name: movies-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MOVIES_FAIL_PERCENT: "30"

  webseries-service:
    <<: *app
    build: ./services/webseries-service
    container_name: webseries-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - USER_SERVICE_URL=http://user-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8085
      - WEBSERIES_FAIL_PERCENT=0

  payment-service:
    <<: *app
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_FAIL_PERCENT: "30"

  dashboard-service:
    <<: *app
    build: ./dashboard-service
    container_name: dashboard-service
    ports:
      - "6969:6969"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jdemo123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      movies-service:
        condition: service_started
      webseries-service:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  traffic:
    image: curlimages/curl:8.10.1
    container_name: traffic
    restart: unless-stopped
    depends_on:
      - dashboard-service
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        r() { od -An -N1 -tu1 /dev/urandom | awk '{print $$1%5+1}'; }
        sleep 25
        while true; do
          curl -s -o /dev/null -m 3 -X POST "http://auth-service:8081/api/auth/login?userId=$$(r)&password=x"
          curl -s -o /dev/null -m 3 "http://user-service:8082/api/users/$$(r)"
          curl -s -o /dev/null -m 3 "http://movies-service:8083/api/movies/$$(r)"
          curl -s -o /dev/null -m 3 "http://webseries-service:8084/api/webseries/watch?userId=$$(r)&seriesId=$$(r)"
          curl -s -o /dev/null -m 3 "http://payment-service:8085/api/payments/status/$$(r)"
          sleep 1.5
        done